  <script>
    // ============================================
    // SWIPE GESTURES
    // ============================================
    function addSwipe(element, onSwipeLeft, onSwipeRight) {
      if (!element) return;
      let startX = 0;
      let startY = 0;
      element.addEventListener('touchstart', (e) => {
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
      }, { passive: true });
      element.addEventListener('touchend', (e) => {
        const dx = e.changedTouches[0].clientX - startX;
        const dy = e.changedTouches[0].clientY - startY;
        if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 40) {
          if (dx < 0) onSwipeLeft();
          else onSwipeRight();
        }
      }, { passive: true });
    }

    // ============================================
    // HOME CAROUSEL
    // ============================================
    const slides = document.querySelectorAll('.carousel-slide');
    const dotsContainer = document.querySelector('.carousel-dots');
    let current = 0;

    if (slides.length > 0) {
      function showSlide(n) {
        slides.forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.carousel-dot').forEach(d => d.classList.remove('active'));
        current = (n + slides.length) % slides.length;
        slides[current].classList.add('active');
        document.querySelectorAll('.carousel-dot')[current].classList.add('active');
      }

      let timer = setInterval(() => showSlide(current + 1), 6000);

      function resetTimer() {
        clearInterval(timer);
        timer = setInterval(() => showSlide(current + 1), 6000);
      }

      if (dotsContainer) {
        slides.forEach((_, i) => {
          const dot = document.createElement('button');
          dot.className = 'carousel-dot' + (i === 0 ? ' active' : '');
          dot.addEventListener('click', () => { showSlide(i); resetTimer(); });
          dotsContainer.appendChild(dot);
        });
      }

      const carousel = document.querySelector('.carousel');
      addSwipe(carousel,
        () => { showSlide(current + 1); resetTimer(); },
        () => { showSlide(current - 1); resetTimer(); }
      );
    }

    // ============================================
    // PROJECT CLUSTER
    // ============================================
    const cluster = document.getElementById('project-cluster');

if (cluster) {
      const BASE_W      = 250;
      const BASE_H      = 200;
      const SIZE_VAR    = 0.15;
      const MAX_TILT    = 20;
      const TILT_RADIUS = 1400;
      const skipTags    = ['projects', 'work', 'selected', 'spotlight'];

      function makeRand(seed) {
        let s = seed;
        return function(min, max) {
          s = (s * 16807 + 0) % 2147483647;
          return min + (s / 2147483647) * (max - min);
        };
      }

      function generateBlob(seed, blobiness, tension) {
        let s = seed;
        function rand(min, max) {
          s = (s * 16807 + 0) % 2147483647;
          return min + (s / 2147483647) * (max - min);
        }
        const cx = 50, cy = 50, baseR = 42, numPoints = 10;
        const points = [];
        for (let i = 0; i < numPoints; i++) {
          const angle = (i / numPoints) * Math.PI * 2;
          const r = baseR + rand(-blobiness, blobiness);
          points.push({ x: cx + Math.cos(angle) * r, y: cy + Math.sin(angle) * r });
        }
        const n = points.length;
        let path = `from ${points[0].x.toFixed(2)}% ${points[0].y.toFixed(2)}%`;
        for (let i = 0; i < n; i++) {
          const curr = points[i];
          const next = points[(i + 1) % n];
          const prev = points[(i - 1 + n) % n];
          const after = points[(i + 2) % n];
          const c1x = curr.x + (next.x - prev.x) * tension;
          const c1y = curr.y + (next.y - prev.y) * tension;
          const c2x = next.x - (after.x - curr.x) * tension;
          const c2y = next.y - (after.y - curr.y) * tension;
          path += `,curve to ${next.x.toFixed(2)}% ${next.y.toFixed(2)}% with ${c1x.toFixed(2)}% ${c1y.toFixed(2)}% / ${c2x.toFixed(2)}% ${c2y.toFixed(2)}%`;
        }
        return `shape(${path})`;
      }

      const BLOB_STATIC = { blobiness: 6, tension: 0.15 };
      const BLOB_HOVER  = { blobiness: 8, tension: 0.30 };

      const clusterItems = Array.from(cluster.querySelectorAll('.cluster-item'));
      const W = cluster.offsetWidth;
      const H = cluster.offsetHeight;
      const rand = makeRand(0xC0FFEE42);

      const zOrders = clusterItems.map((_, i) => i + 1);
      for (let i = zOrders.length - 1; i > 0; i--) {
        const j = Math.floor(rand(0, 1) * (i + 1));
        [zOrders[i], zOrders[j]] = [zOrders[j], zOrders[i]];
      }

      const cx = W * 0.6;
      const cy = H * 0.5;
      const radius = Math.min(W, H) * 0.35;
      const jitter = 5;

      const cardPositions = [];

      // Build similarity matrix
      const tagSets = clusterItems.map(el =>
        new Set((el.dataset.tags || '').split(',').map(t => t.trim()).filter(t => t && !skipTags.includes(t)))
      );

      function similarity(a, b) {
        let count = 0;
        tagSets[a].forEach(t => { if (tagSets[b].has(t)) count++; });
        return count;
      }

      // Greedy sort
      const sortedIndices = [0];
      const remaining = clusterItems.map((_, i) => i).filter(i => i !== 0);
      while (remaining.length) {
        const last = sortedIndices[sortedIndices.length - 1];
        let bestIdx = 0, bestScore = -1;
        remaining.forEach((idx, pos) => {
          const score = similarity(last, idx);
          if (score > bestScore) { bestScore = score; bestIdx = pos; }
        });
        sortedIndices.push(remaining[bestIdx]);
        remaining.splice(bestIdx, 1);
      }

      const sortedItems = sortedIndices.map(i => clusterItems[i]);

      sortedItems.forEach((el, i) => {
        const originalIdx = sortedIndices[i];
        const sizeMult = rand(1 - SIZE_VAR, 1 + SIZE_VAR);
        const rotation = rand(-5, 5);
        const w = BASE_W * sizeMult;
        const h = BASE_H * sizeMult;

        const angle = (i / sortedItems.length) * Math.PI * 2;
        const left  = cx + Math.cos(angle) * radius + rand(-jitter, jitter) - w / 2;
        const top   = cy + Math.sin(angle) * radius + rand(-jitter, jitter) - h / 2;

        cardPositions.push({ left, top, w, h });

        el.style.left       = `${left}px`;
        el.style.top        = `${top}px`;
        el.style.width      = `${w}px`;
        el.style.zIndex     = zOrders[originalIdx];
        el.style.transform  = `perspective(600px) rotateZ(${rotation}deg)`;
        el.dataset.rotation = rotation;
        el.dataset.blobSeed = originalIdx * 12345 + 9999;

        const img = el.querySelector('.cluster-img');
        img.style.width    = `${w}px`;
        img.style.height   = `${h}px`;

        const blobSeed = originalIdx * 12345 + 9999;
        img.style.clipPath   = generateBlob(blobSeed, BLOB_STATIC.blobiness, BLOB_STATIC.tension);
        img.style.transition = 'clip-path 0.4s ease';

        const shadowOuter = document.createElement('div');
        shadowOuter.style.cssText = `
          position: absolute;
          left: ${left + 1}px;
          top: ${top + 2}px;
          width: ${w}px;
          height: ${h}px;
          z-index: ${zOrders[originalIdx] - 1};
          pointer-events: none;
          overflow: visible;
        `;

        const shadowBlur = document.createElement('div');
        shadowBlur.style.cssText = `
          width: 100%;
          height: 100%;
          filter: blur(22px);
          -webkit-filter: blur(22px);
        `;

        const shadowInner = document.createElement('div');
        shadowInner.style.cssText = `
          width: 100%;
          height: 100%;
          background: rgba(26,92,92,0.4);
          clip-path: ${generateBlob(blobSeed, BLOB_STATIC.blobiness, BLOB_STATIC.tension)};
        `;

        shadowBlur.appendChild(shadowInner);
        shadowOuter.appendChild(shadowBlur);
        cluster.appendChild(shadowOuter);
        el._shadowInner = shadowInner;
        el._shadowOuter = shadowOuter;


        

        el.addEventListener('mouseenter', () => {
          if (el._dragging) return;
          img.style.clipPath         = generateBlob(blobSeed, BLOB_HOVER.blobiness, BLOB_HOVER.tension);
          shadowInner.style.clipPath = generateBlob(blobSeed, BLOB_HOVER.blobiness, BLOB_HOVER.tension);
          shadowInner.style.background = 'rgba(26,92,92,0.5)';
          shadowOuter.style.top = `${cardPositions[i].top + 10}px`;
          
        });

        el.addEventListener('mouseleave', () => {
          if (el._dragging) return;
          img.style.clipPath         = generateBlob(blobSeed, BLOB_STATIC.blobiness, BLOB_STATIC.tension);
          shadowInner.style.clipPath = generateBlob(blobSeed, BLOB_STATIC.blobiness, BLOB_STATIC.tension);
          shadowInner.style.background = 'rgba(26,92,92,0.28)';
          shadowOuter.style.top = `${cardPositions[i].top + 2}px`;
         
        });

        // ── Drag ──────────────────────────────────────────────────────────
        let dragStartX, dragStartY, dragStartLeft, dragStartTop, didDrag;

        el.addEventListener('mousedown', (e) => {
          if (e.button !== 0) return;
          e.preventDefault();
          dragStartX    = e.clientX;
          dragStartY    = e.clientY;
          dragStartLeft = cardPositions[i].left;
          dragStartTop  = cardPositions[i].top;
          didDrag       = false;
          el._dragging  = true;
          el.style.zIndex     = 200;
          el.style.transition = 'none';
          el.style.cursor     = 'grabbing';
        });

        document.addEventListener('mousemove', (e) => {
          if (!el._dragging) return;
          const dx = e.clientX - dragStartX;
          const dy = e.clientY - dragStartY;
          if (!didDrag && Math.sqrt(dx * dx + dy * dy) > 5) didDrag = true;
          if (!didDrag) return;
          const newLeft = dragStartLeft + dx;
          const newTop  = dragStartTop  + dy;
          cardPositions[i].left = newLeft;
          cardPositions[i].top  = newTop;
          el.style.left = `${newLeft}px`;
          el.style.top  = `${newTop}px`;
          shadowOuter.style.left = `${newLeft + 1}px`;
          shadowOuter.style.top  = `${newTop + 2}px`;
          updateConnections();
        });

        document.addEventListener('mouseup', () => {
          if (!el._dragging) return;
          el._dragging = false;
          el.style.zIndex     = zOrders[originalIdx];
          el.style.transition = 'transform 0.08s ease-out';
          el.style.cursor     = 'pointer';
          if (!didDrag && el.dataset.url) {
            window.location.href = el.dataset.url;
          }
        });
      });

      // ── SVG connection lines ──────────────────────────────────────────────
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');

      

      svg.style.cssText = `
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 0;
        overflow: visible;
      `;
      cluster.appendChild(svg);

      const clusterCX = cx;
      const clusterCY = cy;

      const tagMap = {};
      clusterItems.forEach((el) => {
        const tags = (el.dataset.tags || '').split(',').map(t => t.trim()).filter(t => t && !skipTags.includes(t));
        tags.forEach(tag => {
          if (!tagMap[tag]) tagMap[tag] = [];
          tagMap[tag].push(el);
        });
      });

      const sharedTags = Object.entries(tagMap).filter(([, items]) => items.length > 1);

      const tagNodes = sharedTags.map(([tag, items]) => {
        const paths = items.map(() => {
          const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          path.setAttribute('stroke', 'rgba(26,92,92,0.35)');
          path.setAttribute('stroke-width', '2.5');
          path.setAttribute('stroke-linecap', 'round');
          path.setAttribute('stroke-dasharray', '0.1,8');
          path.setAttribute('fill', 'none');
          svg.appendChild(path);
          return path;
        });



        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('r', '8');
        circle.setAttribute('fill', 'rgba(26,92,92,0.5)');
        circle.setAttribute('stroke', 'none');
        circle.style.cursor = 'pointer';
        circle.style.pointerEvents = 'all';
        svg.appendChild(circle);

        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('fill', 'rgba(26,92,92,0.8)');
        text.setAttribute('font-size', '10');
        text.setAttribute('font-family', 'var(--font-body)');
        text.setAttribute('text-anchor', 'middle');
        text.setAttribute('dominant-baseline', 'auto');
        
        const tagFormatMap = {
          'gamingculture': 'GAMING CULTURE',
          'uxdesign': 'UX DESIGN',
          'designresearch': 'DESIGN RESEARCH',
          'urbanfutures': 'URBAN FUTURES',
          'worldbuilding': 'WORLDBUILDING',
          'participatorydesign': 'PARTICIPATORY DESIGN',
        };
        text.textContent = tagFormatMap[tag] || tag.toUpperCase();
        
        text.style.cursor = 'pointer';
        text.style.pointerEvents = 'all';
        svg.appendChild(text);

 const pill = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        pill.setAttribute('fill', 'white');
        pill.setAttribute('filter', 'drop-shadow(1px 1px 4px rgba(119,56,114,0.37))');
        pill.setAttribute('rx', '12');
        pill.setAttribute('ry', '12');
        pill.setAttribute('opacity', '0');
        pill.style.pointerEvents = 'none';
        svg.insertBefore(pill, circle);

        const href = `/projects/?tag=${encodeURIComponent(tag)}`;
        circle.addEventListener('click', () => { window.location.href = href; });
        text.addEventListener('click',   () => { window.location.href = href; });

        circle.addEventListener('mouseenter', () => {
          circle.setAttribute('fill', 'rgba(79,6,103,0.8)');
          text.setAttribute('fill', 'rgba(79,6,103,0.9)');
        });
        circle.addEventListener('mouseleave', () => {
          circle.setAttribute('fill', 'rgba(48,13,37,0.75)');
          text.setAttribute('fill', 'rgba(48,13,37,0.7)');
        });
        text.addEventListener('mouseenter', () => {
          circle.setAttribute('fill', 'rgba(79,6,103,0.8)');
          text.setAttribute('fill', 'rgba(79,6,103,0.9)');
        });
        text.addEventListener('mouseleave', () => {
          circle.setAttribute('fill', 'rgba(48,13,37,0.75)');
          text.setAttribute('fill', 'rgba(48,13,37,0.7)');
        });

        return { tag, items, paths, circle, text, pill, manualX: null, manualY: null, wiggleAmount: 0.5 };
      });

// ── Highlight connected lines on blob hover ───────────────────────────
      const accentColor = getComputedStyle(document.documentElement).getPropertyValue('--color-accent').trim() || '#1a5c5c';
      const defaultStroke = 'rgba(26,92,92,0.35)';
      const defaultCircle = 'rgba(26,92,92,0.5)';
      const defaultText   = 'rgba(26,92,92,0.8)';

      sortedItems.forEach((el) => {
        el.addEventListener('mouseenter', () => {
          if (el._dragging) return;
          tagNodes.forEach((node) => {
            if (!node.items.includes(el)) return;
            animateWiggle(node, 0);
            const pathIdx = node.items.indexOf(el);
            if (pathIdx !== -1) {
              node.paths[pathIdx].setAttribute('stroke', accentColor);
              node.paths[pathIdx].setAttribute('stroke-width', '1.5');
              node.paths[pathIdx].setAttribute('stroke-dasharray', 'none');
            }
            node.circle.setAttribute('fill', accentColor);
            node.circle.setAttribute('r', '10');
            node.text.setAttribute('fill', accentColor);
            node.text.setAttribute('font-weight', '500');
          });
        });

        el.addEventListener('mouseleave', () => {
          if (el._dragging) return;
          tagNodes.forEach((node) => {
            if (!node.items.includes(el)) return;
            animateWiggle(node, 0.5);
            const pathIdx = node.items.indexOf(el);
            if (pathIdx !== -1) {
              node.paths[pathIdx].setAttribute('stroke', defaultStroke);
              node.paths[pathIdx].setAttribute('stroke-width', '2.5');
              node.paths[pathIdx].setAttribute('stroke-dasharray', '0.1,8');
            }
            node.circle.setAttribute('fill', defaultCircle);
            node.circle.setAttribute('r', '8');
            node.text.setAttribute('fill', defaultText);
            node.text.removeAttribute('font-weight');
          });
        });
      });

      // ── Highlight on tag hover ────────────────────────────────────────────
      tagNodes.forEach((node) => {
        function onTagEnter() {
          animateWiggle(node, 0);
          node.paths.forEach(p => {
            p.setAttribute('stroke', accentColor);
            p.setAttribute('stroke-width', '1.5');
            p.setAttribute('stroke-dasharray', 'none');
          });
          node.circle.setAttribute('fill', accentColor);
          node.circle.setAttribute('r', '10');
          node.text.setAttribute('fill', accentColor);
          node.text.setAttribute('font-weight', '500');
          node.pill.setAttribute('opacity', '1');
        }

        function onTagLeave() {
          animateWiggle(node, 0.5);
          node.paths.forEach(p => {
            p.setAttribute('stroke', defaultStroke);
            p.setAttribute('stroke-width', '2.5');
            p.setAttribute('stroke-dasharray', '0.1,8');
          });
          node.circle.setAttribute('fill', defaultCircle);
          node.circle.setAttribute('r', '8');
          node.text.setAttribute('fill', defaultText);
          node.text.removeAttribute('font-weight');
           node.pill.setAttribute('opacity', '0');


        }

        node.circle.addEventListener('mouseenter', onTagEnter);
        node.circle.addEventListener('mouseleave', onTagLeave);
        node.text.addEventListener('mouseenter',   onTagEnter);
        node.text.addEventListener('mouseleave',   onTagLeave);

                        svg.appendChild(node.pill);
          svg.appendChild(node.circle);
          svg.appendChild(node.text);
      });

      function animateWiggle(node, targetWiggle) {
        if (node._wiggleRaf) cancelAnimationFrame(node._wiggleRaf);
        function step() {
          const diff = targetWiggle - node.wiggleAmount;
          if (Math.abs(diff) < 0.002) {
            node.wiggleAmount = targetWiggle;
            updateConnections();
            return;
          }
          node.wiggleAmount += diff * 0.1;
          updateConnections();
          node._wiggleRaf = requestAnimationFrame(step);
        }
        step();
      }

function updateConnections() {
        const clusterRect = cluster.getBoundingClientRect();

        // First pass — compute unconstrained positions for all tag nodes
        const nodePositions = tagNodes.map((node) => {
          const { items } = node;
          const centers = items.map(el => {
            const r = el.getBoundingClientRect();
            return {
              x: r.left + r.width  / 2 - clusterRect.left,
              y: r.top  + r.height / 2 - clusterRect.top
            };
          });

          // If manually dragged, use that position
          if (node.manualX !== null) {
            return { nx: node.manualX, ny: node.manualY, centers };
          }

          let nx = centers.reduce((s, c) => s + c.x, 0) / centers.length;
          let ny = centers.reduce((s, c) => s + c.y, 0) / centers.length;

          // Repel from blobs
          const MIN_DIST = 80;
          for (let iter = 0; iter < 60; iter++) {
            let fx = 0, fy = 0;
            clusterItems.forEach(el => {
              const r = el.getBoundingClientRect();
              const bx = r.left + r.width  / 2 - clusterRect.left;
              const by = r.top  + r.height / 2 - clusterRect.top;
              const dx = nx - bx;
              const dy = ny - by;
              const d  = Math.sqrt(dx * dx + dy * dy);
              if (d < MIN_DIST && d > 0) {
                fx += (dx / d) * (MIN_DIST - d);
                fy += (dy / d) * (MIN_DIST - d);
              }
            });
            if (Math.abs(fx) < 0.5 && Math.abs(fy) < 0.5) break;
            nx += fx * 0.3;
            ny += fy * 0.3;
          }

          // Pull toward cluster center
          nx += (clusterCX - nx) * 0.8;
          ny += (clusterCY - ny) * 0.8;

          return { nx, ny, centers };
        });

        // Second pass — repel tag nodes from each other
        const TAG_MIN_DIST = 100;
        for (let iter = 0; iter < 40; iter++) {
          let anyMoved = false;
          nodePositions.forEach((a, ai) => {
            if (tagNodes[ai].manualX !== null) return;
            nodePositions.forEach((b, bi) => {
              if (ai >= bi) return;
              const dx = a.nx - b.nx;
              const dy = a.ny - b.ny;
              const d  = Math.sqrt(dx * dx + dy * dy);
              if (d < TAG_MIN_DIST && d > 0) {
                const push = (TAG_MIN_DIST - d) * 0.5;
                const nx_push = (dx / d) * push;
                const ny_push = (dy / d) * push;
                if (tagNodes[ai].manualX === null) {
                  a.nx += nx_push;
                  a.ny += ny_push;
                }
                if (tagNodes[bi].manualX === null) {
                  b.nx -= nx_push;
                  b.ny -= ny_push;
                }
                anyMoved = true;
              }
            });
          });
          if (!anyMoved) break;
        }

        // Apply positions and draw lines
        tagNodes.forEach((node, ni) => {
          const { paths, circle, text, items } = node;
          const { nx, ny, centers } = nodePositions[ni];

          circle.setAttribute('cx', nx);
          circle.setAttribute('cy', ny);
          text.setAttribute('x', nx);
          text.setAttribute('y', ny - 20);

// Size pill to text
          const bbox = text.getBBox();
          const pad = 6;
          node.pill.setAttribute('x', bbox.x - pad);
          node.pill.setAttribute('y', bbox.y - pad);
          node.pill.setAttribute('width', bbox.width + pad * 2);
          node.pill.setAttribute('height', bbox.height + pad * 2);

          centers.forEach((c, i) => {
            const dx = nx - c.x;
            const dy = ny - c.y;
            const len = Math.sqrt(dx * dx + dy * dy) || 1;
            const px = -dy / len;
            const py =  dx / len;
            const wiggleSign = ((i + ni) % 2 === 0) ? 1 : -1;
            const wiggle = len * node.wiggleAmount * wiggleSign;
            const cp1x = c.x + dx * 0.33 + px * wiggle;
            const cp1y = c.y + dy * 0.33 + py * wiggle;
            const cp2x = c.x + dx * 0.66 - px * wiggle;
            const cp2y = c.y + dy * 0.66 - py * wiggle;
            paths[i].setAttribute('d', `M ${c.x} ${c.y} C ${cp1x} ${cp1y} ${cp2x} ${cp2y} ${nx} ${ny}`);
          });
        });
      }

      // ── Single mousemove handler ──────────────────────────────────────────
      document.addEventListener('mousemove', (e) => {
        document.querySelectorAll('.cluster-item').forEach((el) => {
          if (el._dragging) return;
          const rotation = parseFloat(el.dataset.rotation) || 0;
          const r   = el.getBoundingClientRect();
          const ecx = r.left + r.width  / 2;
          const ecy = r.top  + r.height / 2;
          const dx  = e.clientX - ecx;
          const dy  = e.clientY - ecy;
          const d   = Math.sqrt(dx * dx + dy * dy);
          const proximity = Math.max(0, 1 - d / TILT_RADIUS);
          const rx  =  (dx / (window.innerWidth  / 2)) * MAX_TILT * proximity;
          const ry  = -(dy / (window.innerHeight / 2)) * MAX_TILT * proximity;
          el.style.transform = `perspective(600px) rotateZ(${rotation}deg) rotateY(${rx}deg) rotateX(${ry}deg)`;

          const label = el.querySelector('.cluster-label');
          if (label) {
            const lx = -(rx * 0.2);
            const ly =  (ry * 0.2);
            label.style.transform = `translate(calc(-50% + ${lx}px), calc(-50% + ${ly}px))`;
          }
        });

        updateConnections();
      });

      updateConnections();
    }

    // ============================================
    // CONTENT SLIDESHOWS
    // ============================================
    document.querySelectorAll('.content-slideshow').forEach(function(slideshow) {
      const ssSlides = slideshow.querySelectorAll('.content-slide');
      const ssDots = slideshow.querySelectorAll('.content-dot');
      let idx = 0;

      function showContentSlide(n) {
        ssSlides[idx].classList.remove('active');
        ssDots[idx].classList.remove('active');
        idx = (n + ssSlides.length) % ssSlides.length;
        ssSlides[idx].classList.add('active');
        ssDots[idx].classList.add('active');
      }

      slideshow.querySelector('.content-prev').addEventListener('click', () => showContentSlide(idx - 1));
      slideshow.querySelector('.content-next').addEventListener('click', () => showContentSlide(idx + 1));
      ssDots.forEach(dot => {
        dot.addEventListener('click', () => showContentSlide(parseInt(dot.dataset.index)));
      });

      addSwipe(slideshow,
        () => slideshow.querySelector('.content-next')?.click(),
        () => slideshow.querySelector('.content-prev')?.click()
      );
    });

    // ============================================
    // TABLE OF CONTENTS
    // ============================================
    const headings = document.querySelectorAll('.project-content h2');
    const tocList = document.getElementById('toc-list');

    if (headings.length > 0 && tocList) {
      headings.forEach((heading, i) => {
        const id = 'section-' + i;
        heading.id = id;
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.href = '#' + id;
        a.textContent = heading.textContent;
        li.appendChild(a);
        tocList.appendChild(li);
      });
    }

    // ============================================
    // LIGHTBOX
    // ============================================
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');

    document.querySelectorAll('img:not(.floating-img):not(.project-card-img):not(.writing-image img):not(.carousel-img):not(.cluster-img)').forEach(img => {
      img.style.cursor = 'zoom-in';
      img.addEventListener('click', () => {
        lightboxImg.src = img.src;
        lightboxImg.alt = img.alt;
        lightbox.style.display = 'flex';
        document.body.classList.add('lightbox-open');
      });
    });

    lightbox.addEventListener('click', () => {
      lightbox.style.display = 'none';
      document.body.classList.remove('lightbox-open');
    });

    document.querySelectorAll('.carousel-img').forEach(img => {
      img.style.cursor = 'default';
      img.addEventListener('click', (e) => e.stopPropagation());
    });

    // ============================================
    // MOBILE NAV
    // ============================================
    const toggle = document.getElementById('mobile-nav-toggle');
    const overlay = document.getElementById('mobile-nav-overlay');
    const navClose = document.getElementById('mobile-nav-close');

    if (toggle) {
      toggle.addEventListener('click', () => overlay.classList.add('open'));
      navClose.addEventListener('click', () => overlay.classList.remove('open'));
      overlay.querySelectorAll('a').forEach(a => {
        a.addEventListener('click', () => overlay.classList.remove('open'));
      });
    }

    // ============================================
    // COPY EMAIL
    // ============================================
    document.querySelectorAll('a[href="mailto:hugopilate@gmail.com"]').forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        navigator.clipboard.writeText('hugopilate@gmail.com').then(() => {
          const original = link.textContent;
          link.textContent = 'Copied!';
          setTimeout(() => { link.textContent = original; }, 2000);
        });
      });
    });

    // ============================================
    // EXTERNAL LINKS
    // ============================================
    document.querySelectorAll('a').forEach(link => {
      const href = link.getAttribute('href');
      if (href && !href.startsWith('#') && !href.startsWith('mailto:') && !href.startsWith('/')) {
        link.setAttribute('target', '_blank');
        link.setAttribute('rel', 'noopener noreferrer');
      }
    });
</script>
